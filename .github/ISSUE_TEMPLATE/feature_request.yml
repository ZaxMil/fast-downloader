name: Feature request
description: Suggest a user-facing improvement or developer enhancement.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user's need before describing the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested solution
      description: How should FastDownloader behave?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Downloading and queues
        - Browser integration
        - User interface
        - Performance
        - Accessibility and translations
        - Other
