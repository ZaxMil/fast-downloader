name: Build Windows release assets

on:
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'src/**'
      - 'extension/**'
      - 'ui/**'
      - 'scripts/**'
      - 'build.bat'
      - 'app.ico'
      - 'installer.ico'
      - '.github/workflows/build-release-assets.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'extension/**'
      - 'ui/**'
      - 'scripts/**'
      - 'build.bat'
      - '.github/workflows/build-release-assets.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build installer, app, browser extension and UI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify browser interception regression cases
        shell: pwsh
        run: |
          node --check extension/background.js
          node tests/extension_intercept.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Extension regression suite failed" }
          node tests/table_columns.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Table regression suite failed" }
          node tests/live_transfers.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Live transfers regression suite failed" }
          node tests/smart_updater.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Smart updater regression suite failed" }
          node tests/dashboard_launch.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Dashboard launch regression suite failed" }
          node tests/disk_space.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Disk widget regression suite failed" }

      - name: Fetch official aria2 and yt-dlp engines for installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path 'bin' | Out-Null
          $ariaZip = Join-Path $env:RUNNER_TEMP 'aria2.zip'
          Invoke-WebRequest -Uri 'https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip' -OutFile $ariaZip
          $ariaExtract = Join-Path $env:RUNNER_TEMP 'aria2-extracted'
          Expand-Archive -Path $ariaZip -DestinationPath $ariaExtract -Force
          $ariaExe = Get-ChildItem -Path $ariaExtract -Filter 'aria2c.exe' -Recurse -File | Select-Object -First 1
          if (-not $ariaExe) { throw 'aria2c.exe was not found in upstream archive' }
          Copy-Item $ariaExe.FullName 'bin/aria2c.exe' -Force

          Invoke-WebRequest -Uri 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile 'bin/yt-dlp.exe'
          foreach ($asset in @('bin/aria2c.exe', 'bin/yt-dlp.exe')) {
            if (-not (Test-Path $asset) -or (Get-Item $asset).Length -lt 100000) { throw "Missing/invalid download engine: $asset" }
            Write-Host "$asset verified"
          }

      - name: Build all four Windows release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/package-all.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "Packaging script failed" }
          foreach ($asset in @('FastDownloader.exe', 'FastDownloader-Setup.exe', 'fast-downloader-extension.zip', 'fast-downloader-ui.zip')) {
            if (-not (Test-Path $asset) -or (Get-Item $asset).Length -lt 50000) { throw "Missing/invalid release asset: $asset" }
          }
          if ((Get-Item 'FastDownloader-Setup.exe').Length -lt 1000000) { throw 'Installer payload unexpectedly small' }
          $manifest = Get-Content 'extension/manifest.json' -Raw | ConvertFrom-Json
          $appVersion = [regex]::Match((Get-Content 'src/Program.cs' -Raw), 'CurrentAppVersion = "([^"]+)"').Groups[1].Value
          if ($manifest.version -ne $appVersion) { throw "App and extension versions do not match" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($a in @(@('fast-downloader-extension.zip', 'background.js'), @('fast-downloader-ui.zip', 'index.html'))) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $a[0]).Path)
            try {
              $names = @($archive.Entries | ForEach-Object { $_.FullName })
              if ($names -notcontains $a[1]) { throw "Archive $($a[0]) does not include $($a[1])" }
            }
            finally { $archive.Dispose() }
          }
          Get-Item 'FastDownloader.exe','FastDownloader-Setup.exe','fast-downloader-extension.zip','fast-downloader-ui.zip' | Select-Object Name,Length

      - name: Verify updater handoff and rollback safety
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appVersion = [regex]::Match((Get-Content 'src/Program.cs' -Raw), 'CurrentAppVersion = "([^"]+)"').Groups[1].Value
          if (-not $appVersion) { throw "Application version missing" }
          $testRoot = Join-Path $env:RUNNER_TEMP 'updater-rehearsal'
          $appDir = Join-Path $testRoot 'installed-app'
          New-Item -ItemType Directory -Force -Path $appDir | Out-Null
          $targetExe = Join-Path $appDir 'FastDownloader.exe'
          'OLD_VERSION_BINARY' | Set-Content -Path $targetExe
          $statusFile = Join-Path $testRoot 'status.json'
          $helper = (Resolve-Path 'scripts/apply-update.ps1').Path
          $newExe = (Resolve-Path 'FastDownloader.exe').Path
          $ext = (Resolve-Path 'fast-downloader-extension.zip').Path
          $ui = (Resolve-Path 'fast-downloader-ui.zip').Path
          $argsCommon = @(
            '-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass',
            '-File',$helper,'-TargetPid','999999',
            '-TargetExe',$targetExe,'-NewExe',$newExe,
            '-ExtensionZip',$ext,'-UiZip',$ui,
            '-StatusFile',$statusFile,'-SkipRestart'
          )
          & powershell.exe @argsCommon '-ExpectedVersion' $appVersion
          if ($LASTEXITCODE -ne 0) { throw 'Updater staging test failed' }
          $status = Get-Content $statusFile -Raw | ConvertFrom-Json
          if ($status.status -ne 'success') { throw "Updater did not report success: $($status.message)" }
          if ((Get-FileHash $targetExe).Hash -ne (Get-FileHash $newExe).Hash) { throw 'Executable was not updated' }
          $manifest = Get-Content (Join-Path $appDir 'extension/manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.version -ne $appVersion) { throw 'Extension package was not applied' }
          if (-not (Test-Path (Join-Path $appDir 'ui/index.html'))) { throw 'UI package was not applied' }

          # Mismatched extension package must fail without overwriting an installed executable.
          $originalHash = (Get-FileHash $targetExe).Hash
          & powershell.exe @argsCommon '-ExpectedVersion' '9.9.9'
          if ($LASTEXITCODE -eq 0) { throw 'Updater accepted a mismatched extension version' }
          $status = Get-Content $statusFile -Raw | ConvertFrom-Json
          if ($status.status -ne 'failed') { throw 'Failed update did not produce a diagnostic status' }
          if ((Get-FileHash $targetExe).Hash -ne $originalHash) { throw 'Failed update damaged installed executable' }

          $resourceNames = [Reflection.Assembly]::LoadFile($newExe).GetManifestResourceNames()
          if ($resourceNames -notcontains 'FastDownloader.updater.ps1') { throw 'External updater was not embedded in Windows app' }
          $global:LASTEXITCODE = 0 # The intentionally rejected update returned exit code 1.
          Write-Host 'Updater staging, version rejection, and embedded resource verified.'

      - name: Verify recovery-script syntax and release packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($source in @('scripts/apply-update.ps1','scripts/recover-in-place.ps1','tests/updater_restart_rehearsal.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $source).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell syntax check failed for $source : $($errors | Out-String)" }
          }

      - name: Verify real updater restart, API identity and companion assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File './tests/updater_restart_rehearsal.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Live updater restart integration test failed' }

      - name: Verify native download confirmation theme and filename handling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'FastDownloader.exe').Path
          $asm = [Reflection.Assembly]::LoadFile($exe)
          $sanitize = $asm.GetType('FastDownloader.WindowsSafeFileName')
          $theme = $asm.GetType('FastDownloader.NativeDialogTheme')
          $dialog = $asm.GetType('FastDownloader.DownloadConfirmDialog')
          if (-not $sanitize -or -not $theme -or -not $dialog) { throw 'Missing themed download confirmation components' }
          $safe = $sanitize.GetMethod('Normalize')
          $actual = $safe.Invoke($null, @('Never Leak API Keys: Try This 80ms Tool - YouTube.mp4'))
          if ($actual -notmatch 'Never Leak API Keys - Try This 80ms Tool - YouTube\.mp4') { throw "Invalid video filename correction: $actual" }
          foreach ($name in @('CON.txt','nul.mp4','AUX','LPT1.zip')) {
            $fixed = [string]$safe.Invoke($null, @($name))
            if (-not $fixed.StartsWith('_')) { throw "Reserved Windows basename not corrected: $name" }
          }
          $bad = [string]$safe.Invoke($null, @('Why? Here* is <a> | sample.mp4'))
          if ($bad.IndexOfAny([IO.Path]::GetInvalidFileNameChars()) -ge 0) { throw 'Unsafe filename was returned' }
          foreach ($candidate in @('dark','light','zaxcore')) {
            $normalized = [string]$theme.GetMethod('Normalize').Invoke($null, @($candidate))
            if ($normalized -ne $candidate) { throw "Theme not supported: $candidate" }
          }
          $unknown = [string]$theme.GetMethod('Normalize').Invoke($null, @('invalid-theme'))
          if ($unknown -ne 'dark') { throw 'Invalid theme did not fall back to dark' }
          Write-Host "PASS: Filename/title sanitization, reserved names, theme palettes, native dialog compiled."

      - name: Verify live downloads disk metrics against Windows volume
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'FastDownloader.exe').Path
          $assembly = [Reflection.Assembly]::LoadFile($exe)
          $type = $assembly.GetType('FastDownloader.DownloadDiskSpace')
          if (-not $type) { throw 'DownloadDiskSpace is missing from Windows app' }
          $method = $type.GetMethod('GetStatus')
          $folder = Join-Path $env:RUNNER_TEMP 'downloads-test'
          $invokeArgs = [object[]]::new(1)
          $invokeArgs[0] = [string]$folder
          $metrics = $method.Invoke($null, $invokeArgs)
          if (-not $metrics['ok']) { throw 'DriveInfo failed to read the downloads volume' }
          $drive = [System.IO.DriveInfo]::new([System.IO.Path]::GetPathRoot($folder))
          if ($metrics['totalBytes'] -ne $drive.TotalSize) { throw 'Incorrect downloads disk capacity' }
          if ([Math]::Abs([double]$metrics['freeBytes'] - [double]$drive.AvailableFreeSpace) -gt 1073741824) { throw 'Incorrect downloads disk free space' }
          if ($metrics['usedPercent'] -lt 0 -or $metrics['usedPercent'] -gt 100) { throw 'Invalid disk usage percentage' }
          $invokeArgs[0] = [string]$null
          $invalid = $method.Invoke($null, $invokeArgs)
          if ($invalid['ok']) { throw 'Invalid folder returned fabricated disk values' }
          Write-Host "Downloads volume $($metrics['drive']) has $($metrics['freeBytes']) bytes available."

      - name: Render native download modal visual QA previews
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -NonInteractive -Sta -ExecutionPolicy Bypass -File './tests/preview_native_dialog.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Dialog rendering failed' }

      - name: Upload native download modal visual previews
        uses: actions/upload-artifact@v4
        with:
          name: native-download-dialog-previews
          path: dialog-preview/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload release candidate (not published automatically)
        uses: actions/upload-artifact@v4
        with:
          name: fastdownloader-release-candidate
          path: |
            FastDownloader.exe
            FastDownloader-Setup.exe
            fast-downloader-extension.zip
            fast-downloader-ui.zip
            scripts/apply-update.ps1
            scripts/recover-in-place.ps1
          if-no-files-found: error
          retention-days: 14

  # PRs keep their read-only permissions. A tested main branch build may publish.
  publish:
    name: Publish verified in-app update
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fastdownloader-release-candidate
          path: release

      - name: Publish only a newer version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*CurrentAppVersion = "\([^"]*\)".*/\1/p' src/Program.cs | head -n 1)
          EXT_VERSION=$(node -p "require('./extension/manifest.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid application version"; exit 1
          fi
          if [ "$VERSION" != "$EXT_VERSION" ]; then
            echo "App and extension version mismatch"; exit 1
          fi
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $TAG. Skipping."
            exit 0
          fi
          LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' 2>/dev/null || true)
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$TAG" "$LATEST" | sort -V | tail -n 1)" != "$TAG" ]; then
            echo "Refusing downgrade from $LATEST to $TAG"
            exit 1
          fi
          for asset in FastDownloader.exe FastDownloader-Setup.exe fast-downloader-extension.zip fast-downloader-ui.zip; do
            test -s "release/$asset"
          done
          test -s release/scripts/apply-update.ps1
          test -s release/scripts/recover-in-place.ps1
          gh release create "$TAG" \
            "release/FastDownloader.exe" \
            "release/FastDownloader-Setup.exe" \
            "release/fast-downloader-extension.zip" \
            "release/fast-downloader-ui.zip" \
            "release/scripts/apply-update.ps1" \
            "release/scripts/recover-in-place.ps1" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FastDownloader Pro $TAG" \
            --notes "In-app update for existing installations: reliable video capture, simplified browser controls, redesigned transfer dialogs, Windows Downloads defaults, and lower idle CPU overhead."

      - name: Check public update assets have SHA-256 digests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*CurrentAppVersion = "\([^"]*\)".*/\1/p' src/Program.cs | head -n 1)
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" \
              | jq -e '[
                  .assets[] |
                  select(
                    .name == "FastDownloader.exe" or
                    .name == "FastDownloader-Setup.exe" or
                    .name == "fast-downloader-extension.zip" or
                    .name == "fast-downloader-ui.zip" or
                    .name == "apply-update.ps1" or
                    .name == "recover-in-place.ps1"
                  ) |
                  select(.digest != null and (.digest | startswith("sha256:")))
                ] | length == 6' >/dev/null; then
              echo "All six release assets have SHA-256 digests."
              exit 0
            fi
            sleep 5
          done
          echo "Release SHA-256 verification failed"
          exit 1
