<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="540" viewBox="0 0 1440 540" role="img" aria-labelledby="title desc">
<title id="title">FastDownloader Pro — Your downloads, under control</title>
<desc id="desc">Dark graphite and mint-blue editorial product banner illustrating a Windows download queue with multiple connections.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090F19"/><stop offset=".56" stop-color="#101824"/><stop offset="1" stop-color="#111B2C"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2=".12"><stop stop-color="#B4FF7B"/><stop offset=".42" stop-color="#63F5C8"/><stop offset="1" stop-color="#6DAEFF"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1A2735"/><stop offset="1" stop-color="#0B1522"/></linearGradient>
 <linearGradient id="speed" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9BFF87"/><stop offset=".5" stop-color="#46DFC6"/><stop offset="1" stop-color="#639EF8"/></linearGradient>
 <radialGradient id="bloomA"><stop stop-color="#53EDAD" stop-opacity=".23"/><stop offset="1" stop-color="#53EDAD" stop-opacity="0"/></radialGradient>
 <radialGradient id="bloomB"><stop stop-color="#6674F8" stop-opacity=".22"/><stop offset="1" stop-color="#6674F8" stop-opacity="0"/></radialGradient>
 <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#B8D1EC" opacity=".13"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="25"/></filter>
</defs>
<rect width="1440" height="540" rx="25" fill="url(#bg)"/>
<rect width="1440" height="540" rx="25" fill="url(#dots)"/>
<ellipse cx="1070" cy="95" rx="430" ry="295" fill="url(#bloomB)"/>
<ellipse cx="360" cy="510" rx="430" ry="275" fill="url(#bloomA)"/>
<rect x="2" y="2" width="1436" height="536" rx="23" fill="none" stroke="#65809B" stroke-opacity=".5" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif">
 <rect x="67" y="52" width="255" height="37" rx="18" fill="#142E2E" stroke="#417F78"/>
 <circle cx="87" cy="70.5" r="5.5" fill="#A9FC99"/>
 <text x="104" y="77" font-size="14" fill="#BDF9DE" letter-spacing="1.8" font-weight="700">WINDOWS DOWNLOAD MANAGER</text>
 <text x="63" y="207" font-size="114" font-weight="900" letter-spacing="-6" fill="#F4F8FE">FAST</text>
 <text x="63" y="305" font-size="89" font-weight="900" letter-spacing="-5" fill="url(#accent)">DOWNLOADER<tspan fill="#EEF5FF">.</tspan></text>
 <text x="70" y="370" font-size="29" font-weight="700" fill="#E7F0FB">Your downloads. Under control.</text>
 <text x="70" y="410" font-size="20" fill="#A6BAD0">Parallel transfers, a focused queue, browser integration.</text>
 <rect x="70" y="445" width="244" height="39" rx="11" fill="#B6FE9A"/>
 <text x="88" y="470" font-size="14" font-weight="800" fill="#122920" letter-spacing=".9">UP TO 32 CONNECTIONS</text>
 <rect x="329" y="445" width="158" height="39" rx="11" fill="#1B2D46" stroke="#567A92" stroke-opacity=".8"/>
 <text x="351" y="470" font-size="14" font-weight="700" fill="#CBE8F9" letter-spacing="1">OPEN SOURCE</text>
 <text x="70" y="516" font-size="12" letter-spacing="2.2" fill="#6E87A3">BUILT FOR CONTROL / DESIGNED FOR SPEED</text>
 <rect x="825" y="55" width="548" height="420" rx="23" fill="#060D15" opacity=".78" filter="url(#blur)"/>
 <rect x="820" y="52" width="548" height="420" rx="23" fill="url(#panel)" stroke="#5F91A3" stroke-opacity=".7" stroke-width="1.8"/>
 <rect x="821" y="53" width="546" height="58" rx="21" fill="#152130"/>
 <path d="M821 111H1367" stroke="#44657C" stroke-opacity=".6"/>
 <circle cx="849" cy="82" r="6" fill="#F08087"/><circle cx="871" cy="82" r="6" fill="#F4C675"/><circle cx="893" cy="82" r="6" fill="#8FE7AF"/>
 <text x="950" y="88" font-size="14" font-weight="700" letter-spacing="1.1" fill="#D5E5F4">FASTDOWNLOADER PRO</text>
 <rect x="1250" y="68" width="92" height="28" rx="14" fill="#1E433A" stroke="#3E7F6A"/>
 <circle cx="1266" cy="82" r="4" fill="#B2FE94"/>
 <text x="1278" y="87" font-size="12" font-weight="700" fill="#C4FEE1">READY</text>
 <text x="852" y="154" font-size="14" fill="#859FB8" font-weight="700" letter-spacing="1.6">DOWNLOAD ACTIVITY</text>
 <text x="852" y="189" font-size="30" fill="#F3F8FD" font-weight="800">All your transfers, one view.</text>
 <rect x="847" y="210" width="494" height="90" rx="13" fill="#111F2B" stroke="#31546B"/>
 <circle cx="871" cy="239" r="10" fill="#235843"/>
 <path d="M871 234v10m-4-4 4 4 4-4" fill="none" stroke="#ACFFC9" stroke-width="2.2" stroke-linecap="round"/>
 <text x="892" y="244" font-size="16" font-weight="700" fill="#E6F1FA">Large file transfer</text>
 <text x="1322" y="244" text-anchor="end" font-size="13" fill="#9CB9CD">In progress</text>
 <rect x="870" y="262" width="448" height="8" rx="4" fill="#293A4A"/>
 <rect x="870" y="262" width="328" height="8" rx="4" fill="url(#speed)"/>
 <rect x="847" y="314" width="494" height="90" rx="13" fill="#111F2B" stroke="#31546B"/>
 <circle cx="871" cy="343" r="10" fill="#244B73"/>
 <path d="M871 338v10m-4-4 4 4 4-4" fill="none" stroke="#ADD2FF" stroke-width="2.2" stroke-linecap="round"/>
 <text x="892" y="348" font-size="16" font-weight="700" fill="#E6F1FA">Another download</text>
 <text x="1322" y="348" text-anchor="end" font-size="13" fill="#9CB9CD">Queued</text>
 <rect x="870" y="366" width="448" height="8" rx="4" fill="#293A4A"/>
 <rect x="870" y="366" width="90" height="8" rx="4" fill="#6CA7F5"/>
 <rect x="847" y="418" width="494" height="37" rx="10" fill="#183A35" stroke="#366C64"/>
 <circle cx="866" cy="436" r="4.5" fill="#B7FF8F"/>
 <text x="881" y="442" font-size="13" font-weight="700" fill="#C1F6E1" letter-spacing=".6">STREAM MANAGEMENT  /  BROWSER COMPANION</text>
 <text x="1368" y="514" text-anchor="end" font-size="12" letter-spacing="1.5" fill="#738FA9">FASTDOWNLOADER / ZAXMIL</text>
</g>
</svg>