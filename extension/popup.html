<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #101012;
      --card-bg: #18181b;
      --card-border: #27272a;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #10b981;
      --accent-hover: #059669;
      --accent-glow: rgba(16, 185, 129, 0.25);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 275px;
      padding: 9px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      background: var(--bg);
      color: var(--text);
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* TOP NAV */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-logo {
      width: 17px;
      height: 17px;
      border-radius: 4px;
      box-shadow: 0 0 8px var(--accent-glow);
    }
    .brand-info {
      display: flex;
      flex-direction: column;
    }
    .brand-title {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
      letter-spacing: -0.2px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 3.5px;
      font-size: 8.5px;
      color: var(--text-muted);
      cursor: pointer;
      margin-top: 1.5px;
    }
    .status-badge:hover {
      color: var(--text);
    }
    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ef4444;
      transition: all 0.2s;
    }
    .dot.connected {
      background: var(--accent);
      box-shadow: 0 0 5px var(--accent);
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* MINI TOGGLE SWITCH */
    .switch-wrap {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      font-size: 9px;
      color: var(--text-muted);
    }
    .switch-wrap input {
      display: none;
    }
    .slider {
      position: relative;
      width: 22px;
      height: 13px;
      background: #27272a;
      border-radius: 8px;
      transition: 0.2s;
      border: 1px solid #3f3f46;
    }
    .slider:before {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      left: 2px;
      bottom: 2px;
      background: #71717a;
      border-radius: 50%;
      transition: 0.2s;
    }
    input:checked + .slider {
      background: var(--accent);
      border-color: var(--accent);
    }
    input:checked + .slider:before {
      transform: translateX(9px);
      background: #fff;
    }

    /* OPEN APP BUTTON */
    .btn-app {
      padding: 2.5px 5.5px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 4px;
      color: var(--accent);
      font-size: 9.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 2.5px;
      transition: all 0.15s;
    }
    .btn-app:hover {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 0 6px var(--accent-glow);
    }

    /* PAGE MEDIA SNIFFER CARD */
    .media-card {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.08), rgba(24, 24, 27, 0.8));
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 6px;
      padding: 6px 7px;
      margin-bottom: 7px;
    }
    .media-header {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 5px;
    }
    .media-tag {
      font-size: 8px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 1px 4px;
      border-radius: 3px;
      background: var(--accent);
      color: #000;
      letter-spacing: 0.3px;
    }
    .media-title {
      font-size: 10px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .media-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 4px;
    }
    .pill-btn {
      padding: 4px 2px;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 4px;
      color: var(--text);
      font-size: 9px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: all 0.15s;
    }
    .pill-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(16, 185, 129, 0.1);
    }
    .pill-primary {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 700;
    }
    .pill-primary:hover {
      background: var(--accent-hover);
      color: #fff;
    }
    .pill-icon {
      padding: 4px 6px;
    }

    /* INPUT ROW */
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 7px;
    }
    .url-input {
      width: 100%;
      height: 29px;
      padding: 5px 24px 5px 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 5px;
      color: #fff;
      font-size: 10.5px;
      outline: none;
      transition: border-color 0.15s;
    }
    .url-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }
    .paste-btn {
      position: absolute;
      right: 3px;
      background: none;
      border: none;
      padding: 3px 4px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      transition: color 0.15s;
    }
    .paste-btn:hover {
      color: var(--accent);
      background: rgba(255, 255, 255, 0.05);
    }

    /* PROBE PREVIEW CARD */
    .probe-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 5px;
      padding: 5px 7px;
      margin-bottom: 7px;
    }
    .probe-name {
      font-size: 10px;
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .probe-badges {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .badge {
      font-size: 8.5px;
      padding: 1.5px 4px;
      border-radius: 3px;
      background: #27272a;
      color: var(--text-muted);
      border: 1px solid #3f3f46;
    }
    .badge-cat {
      margin-left: auto;
      color: var(--accent);
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.3);
    }

    /* DOWNLOAD BUTTON */
    .btn-download {
      width: 100%;
      height: 31px;
      padding: 0;
      background: var(--accent);
      border: none;
      border-radius: 5px;
      color: #042f1a;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: 0 2px 8px var(--accent-glow);
      transition: all 0.15s;
    }
    .btn-download:hover {
      background: var(--accent-hover);
      color: #fff;
    }
    .btn-download:active {
      transform: scale(0.98);
    }

    /* LIVE ACTIVITY STRIP */
    .activity-bar {
      margin-top: 7px;
      padding: 4px 7px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 9px;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.15s;
    }
    .activity-bar:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: #3f3f46;
    }
    .activity-status {
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .activity-dot {
      width: 4.5px;
      height: 4.5px;
      border-radius: 50%;
      background: var(--accent);
    }
    .activity-link {
      font-size: 8.5px;
      color: var(--accent);
      font-weight: 600;
      flex-shrink: 0;
      margin-left: 4px;
    }

    /* FOOTER */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 7px;
      padding-top: 5px;
      font-size: 8.5px;
      color: #71717a;
    }
    .footer a {
      color: #a1a1aa;
      text-decoration: none;
      transition: color 0.15s;
    }
    .footer a:hover {
      color: #ff5e5b;
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="top-nav">
    <div class="brand">
      <img src="icons/icon32.png" class="brand-logo" alt="Logo">
      <div class="brand-info">
        <div class="brand-title">FastDownloader</div>
        <div id="statusBadge" class="status-badge" title="Click to open app">
          <span id="dot" class="dot"></span>
          <span id="statusText">Checking...</span>
        </div>
      </div>
    </div>
    <div class="nav-actions">
      <label class="switch-wrap" title="Auto-intercept browser downloads (IDM mode)">
        <input type="checkbox" id="interceptToggle" checked>
        <span class="slider"></span>
        <span>Auto</span>
      </label>
      <label class="switch-wrap" title="Show video download button on web pages">
        <input type="checkbox" id="videoBtnToggle" checked>
        <span class="slider"></span>
        <span>Video</span>
      </label>
      <button id="reloadExtBtn" class="btn-app" title="Sync & Reload Extension (Refreshes runtime from disk)" style="padding: 3px 6px;">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <button id="openAppBtn" class="btn-app" title="Open Desktop App Window">
        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span>App</span>
      </button>
    </div>
  </header>

  <!-- FOUND ON PAGE CARD (Auto-detects active tab video / media) -->
  <section id="mediaCard" class="media-card" style="display: none;">
    <div class="media-header">
      <span class="media-tag">Media</span>
      <span id="mediaTitle" class="media-title">Detecting...</span>
    </div>
    <div class="media-actions">
      <button class="pill-btn pill-primary" data-quality="best" title="Best Quality (1080p/4K)">
        <span>🎬 Best</span>
      </button>
      <button class="pill-btn" data-quality="720p" title="Fast 720p HD">
        <span>720p</span>
      </button>
      <button class="pill-btn" data-quality="audio" title="Audio (MP3)">
        <span>🎵 MP3</span>
      </button>
      <button id="copyMediaBtn" class="pill-btn pill-icon" title="Copy Video Link">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      </button>
    </div>
  </section>

  <!-- URL INPUT ROW -->
  <div class="input-wrap">
    <input type="text" id="urlInput" class="url-input" placeholder="Paste link or magnet URL..." autocomplete="off">
    <button id="pasteBtn" class="paste-btn" title="Paste from clipboard">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
    </button>
  </div>

  <!-- PROBE PREVIEW CARD -->
  <div id="probePreview" class="probe-card" style="display: none;">
    <div id="probeFileName" class="probe-name">Direct Download</div>
    <div class="probe-badges">
      <span id="probeSize" class="badge">-- MB</span>
      <span id="probeResumable" class="badge">Resumable</span>
      <span id="probeCategory" class="badge badge-cat">Auto</span>
    </div>
  </div>

  <!-- MAIN DOWNLOAD CTA -->
  <button id="downloadBtn" class="btn-download">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    <span>Turbo Download (16x)</span>
  </button>

  <!-- LIVE ACTIVITY STRIP -->
  <div id="activityBar" class="activity-bar">
    <div class="activity-status">
      <span class="activity-dot"></span>
      <span id="activityText">Ready • Idle</span>
    </div>
    <span class="activity-link">App ➔</span>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <span id="extVerText">v0.1.3</span>
    <a href="https://ko-fi.com/zaxmi" target="_blank">💖 Ko-fi</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
