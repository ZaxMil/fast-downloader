<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 290px;
      padding: 14px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18181b;
      color: #f4f4f5;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #10b981;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #a1a1aa;
      margin-bottom: 12px;
      padding: 6px 10px;
      background: #27272a;
      border-radius: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }
    .dot.connected {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 6px 10px;
      background: #27272a;
      border-radius: 6px;
      font-size: 11.5px;
      color: #e4e4e7;
    }
    .toggle-row input {
      cursor: pointer;
      width: 16px;
      height: 16px;
      accent-color: #10b981;
      margin: 0;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      margin-bottom: 8px;
      box-sizing: border-box;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #10b981;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #10b981;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover {
      background: #059669;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon32.png" style="width:20px;height:20px;border-radius:4px;box-shadow:0 0 8px rgba(16,185,129,0.4);" alt="Logo">
    <span>FastDownloader Pro</span>
  </div>
  <div class="status">
    <div id="dot" class="dot"></div>
    <span id="statusText">Checking connection...</span>
  </div>
  <div class="toggle-row">
    <span>🎯 Auto-Grab Downloads</span>
    <input type="checkbox" id="interceptToggle" checked>
  </div>
  <input type="text" id="urlInput" placeholder="Paste link or magnet URL...">
  <button id="downloadBtn">Download with Cookies & 16x</button>

  <script src="popup.js"></script>
</body>
</html>
